[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pSprout"
version = "0.1.0"
description = "Chemical generation utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "PyYAML",
    "rdkit",
]

[project.optional-dependencies]
visualization = [
    "matplotlib",
    "pygraphviz",
    "pyvis",
]
legacy = [
    "pandas",
]

[tool.setuptools.packages.find]
include = ["psprout*"]

[tool.setuptools.package-data]
"psprout.modifications" = ["*.yaml"]
